<body>
<h2 style="text-align:center;">Top Haunted Cities</h2>
<div id="chart-container">
  <div id="bar-chart"></div>
</div>
<div id="tooltip"></div>
<script>
const barWidth = 15; // Minimum bar width
const chartHeight = 600;
const tooltip = d3.select("#tooltip");
  
d3.json("city_counts.json")
  .then(data => {
    console.log("Raw data loaded:", data);
    const filteredData = data.filter(d => d.count >= 10);
    console.log("Filtered data (count >= 5):", filteredData);


    const dynamicWidth = Math.max(filteredData.length * barWidth, 400);

    const svg = d3.select("#bar-chart").append("svg")
      .attr("width", dynamicWidth)
      .attr("height", chartHeight);

    const margin = { top: 50, right: 30, bottom: 150, left: 60 };
    const width = dynamicWidth - margin.left - margin.right;
    const height = chartHeight - margin.top - margin.bottom;

    const g = svg.append("g")
      .attr("transform", `translate(${margin.left},${margin.top})`);

    filteredData.sort((a, b) => b.count - a.count);

    const x = d3.scaleBand()
      .domain(filteredData.map(d => d.city))
      .range([0, width])
      .padding(0.1);

    const y = d3.scaleLinear()
      .domain([0, d3.max(filteredData, d => d.count)])
      .nice()
      .range([height, 0]);

    g.append("g")
      .attr("transform", `translate(0,${height})`)
      .call(d3.axisBottom(x))
      .selectAll("text")
      .style("font-size", "10px")
      .attr("transform", "rotate(-45)")
      .style("text-anchor", "end");

    g.append("g").call(d3.axisLeft(y));

    g.selectAll(".bar")
      .data(filteredData)
      .enter().append("rect")
      .attr("class", "bar")
      .attr("x", d => x(d.city))
      .attr("y", d => y(d.count))
      .attr("width", x.bandwidth())
      .attr("height", d => height - y(d.count))
      .on("mouseover", (event, d) => {
        tooltip.style("opacity", 1)
          .html(`<strong>${d.city}</strong><br/>Count: ${d.count}`);
      })
      .on("mousemove", (event) => {
        tooltip.style("left", (event.pageX + 10) + "px")
               .style("top", (event.pageY - 28) + "px");
      })
      .on("mouseout", () => {
        tooltip.style("opacity", 0);
      });
  })
  .catch(error => {
    console.error("❌ Error loading or parsing JSON data:", error);
  });
</script>
</body>
</html>
