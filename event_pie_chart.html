    <!info about the page>
  <title>Event Type Pie Chart (With Legend)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; }
    .legend { font-size: 12px; }
    .legend rect { stroke-width: 2; }
    #container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 30px;
    }
  </style>
</head>
<body>
<h2 style="text-align:center;">Haunted Event Types</h2>
<div id="container">
  <div id="pie-chart"></div>
  <div id="legend"></div>
</div>

<script>
  console.log("Script loaded");
const width = 500;
const height = 500;
const radius = Math.min(width, height) / 2 - 50;

const svg = d3.select("#pie-chart")
  .append("svg")
  .attr("width", width)
  .attr("height", height)
  .append("g")
  .attr("transform", `translate(${width / 2}, ${height / 2})`);

const color = d3.scaleOrdinal(d3.schemeCategory10);
const pie = d3.pie().sort(null).value(d => d.count);
const arc = d3.arc().innerRadius(0).outerRadius(radius);

fetch("event_type_counts.json")
  .then(response => {
    if (!response.ok) throw new Error("Network response was not ok");
    return response.json();
  })
  .then(data => {
    console.log("✅ Data loaded successfully:", data);

    const pieData = pie(data);

    svg.selectAll('path')
      .data(pieData)
      .enter()
      .append('path')
      .attr('d', arc)
      .attr('fill', d => color(d.data.event_type))
      .attr('stroke', 'white')
      .attr('stroke-width', 2);

    const legend = d3.select("#legend")
      .append("svg")
      .attr("width", 200)
      .attr("height", pieData.length * 25);

    const legendItem = legend.selectAll(".legend-item")
      .data(pieData)
      .enter()
      .append("g")
      .attr("transform", (d, i) => `translate(0, ${i * 25})`)
      .attr("class", "legend-item");

    legendItem.append("rect")
      .attr("width", 18)
      .attr("height", 18)
      .attr("fill", d => color(d.data.event_type));

    legendItem.append("text")
      .attr("x", 24)
      .attr("y", 14)
      .text(d => `${d.data.event_type} (${d.data.count})`);
  })
  .catch(error => {
    console.error("❌ Error loading or parsing JSON data:", error);
  });
</script>
</body>
